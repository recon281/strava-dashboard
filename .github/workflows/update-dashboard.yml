name: Update Strava Dashboard

on:
  schedule:
    # Runs every 2 hours. Edit the cron to change frequency (UTC time).
    - cron: '0 */2 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build dashboard
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: python3 build_dashboard.py

      - name: Commit updated dashboard
        run: |
          git config user.name "strava-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet && echo "No changes" || git commit -m "Auto-update dashboard"
          git push
